<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Curriculum Vitae of Elijah W. Kim, quantum computing researcher and technology educator.">
  <meta name="theme-color" content="#090909">
  <title>CV | Elijah W. Kim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261007">
</head>
<body class="cv-page">
  <div class="noise"></div>
  <header class="nav">
    <a class="logo" href="index.html">Elijah W. Kim<span>.</span></a>
    <nav><a href="index.html#about">About</a><a href="index.html#research">Research</a><a href="index.html#contact">Contact</a></nav>
    <a class="cv-back" href="index.html">← Portfolio</a>
  </header>
  <main class="cv-main">
    <section class="cv-access-card" id="cv-gate">
      <p class="eyebrow">PRIVATE CV</p>
      <h1>CV access</h1>
      <p class="cv-access-copy">Enter the password to view the curriculum vitae.</p>
      <form id="cv-access-form">
        <label for="cv-password">Password</label>
        <div class="cv-access-controls">
          <input id="cv-password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">View CV <span>↗</span></button>
        </div>
        <p class="cv-access-error" id="cv-access-error" role="status" aria-live="polite" hidden></p>
        <span id="year" hidden></span>
      </form>
    </section>
    <div class="cv-content" id="cv-content" hidden></div>
  </main>
  <div class="color-lens" aria-hidden="true"></div>
  <script src="script.js"></script>
  <script src="cv-access.js"></script>
</body>
</html>
